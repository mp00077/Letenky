[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "letenky"
version = "0.1.0"
description = "Desktopové sledování cen letenek Ryanair"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7", "tzdata>=2025.2"]

[project.optional-dependencies]
build = ["pyinstaller>=6.16,<7"]

[project.gui-scripts]
letenky = "letenky.bootstrap:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
letenky = ["storage/migrations/*.sql", "providers/ryanair/airports.json"]
